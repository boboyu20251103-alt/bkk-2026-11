# 曼谷 2026-11 行程資料（build.py 只讀這份＋lang.toml）
# 內容來源：v20 行程草案（plan.md）＋事實稽核（facts.md），2026-10-25
#
# ⚠ 這份會公開在 GitHub。不要寫：PNR／票號／確認碼／卡號／住宿門牌與座標／房東姓名電話／門鎖密碼。
#    build.py 會掃描並拒絕建置（私密字串放在 git-ignored 的 data/private.local）。
#
# 欄位速查
#   stop.time   "HH:MM"（05:00 前算當天最後）；label 可覆寫顯示文字（"~12:10"、"宵夜"）
#   stop.mode   這一站「怎麼到」：grab / bts / walk / moto / plane / none
#   stop.leg    怎麼到這一站的文字；leg_thb 交通費（฿，兩人）
#   stop.reserve none 不用 / walkin 不接受訂位 / ask 先問 / optional 可訂 / need 需預約 / booked 已訂
#   stop.book_by 需預約的期限（過了顯示「逾期未訂」）
#   stop.pay    cash 只收現金 / card 可刷卡 / both / online 線上付 / unknown 未驗證 / none
#   stop.cost   這一站花費（฿，兩人，估算）；bcat 預算分類（省略時依 cat）
#   stop.meal   早 / 午 / 晚 / 宵夜（會進「今天吃什麼」）
#   stop.must   必吃／必買清單；單項可寫 "必吃：xxx" 覆寫種類
#   place.th    泰文店名（給司機看）；th_ok=false 會標「待核對」

[meta]
schema = 2
title = "曼谷 7 天 6 夜"
